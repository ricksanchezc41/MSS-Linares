<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Programa de sanitización · MSS</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<!-- Firebase SDKs (Versión Compat para un solo archivo) -->
<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#eef2f1;--card:#fff;--tx:#14232b;--mut:#5d6f77;--bd:#d3dcdb;--ac:#0f7b6c;--acx:#fff;--ok:#1f8a4c;--wn:#b87d00;--bad:#c0392b;--soft:#e2eceb;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a1f;--card:#17252c;--tx:#e6eeee;--mut:#93a6ac;--bd:#2b3d45;--ac:#37b8a5;--acx:#08201c;--ok:#4cc27d;--wn:#e0a823;--bad:#ef7566;--soft:#1f3239;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1a1f;--card:#17252c;--tx:#e6eeee;--mut:#93a6ac;--bd:#2b3d45;--ac:#37b8a5;--acx:#08201c;--ok:#4cc27d;--wn:#e0a823;--bad:#ef7566;--soft:#1f3239;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 Barlow,system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3{font-family:"Barlow Condensed","Arial Narrow",sans-serif;margin:0;letter-spacing:.2px}
header{background:var(--ac);color:var(--acx);padding:14px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
header h1{font-size:26px}header small{opacity:.85;flex:1}
nav{display:flex;gap:4px;padding:10px 16px 0;border-bottom:1px solid var(--bd);background:var(--card);overflow-x:auto}
nav button{border:0;background:none;color:var(--mut);font:600 15px Barlow,system-ui,sans-serif;padding:10px 14px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav button.on{color:var(--tx);border-color:var(--ac)}
main{padding:18px 16px 40px;max-width:1180px;margin:auto}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.grow{flex:1}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.st{background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:14px;border-left:5px solid var(--ac)}
.st b{display:block;font:700 34px "Barlow Condensed",sans-serif}.st span{color:var(--mut)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:16px;margin-bottom:16px}
.bars{display:flex;gap:10px;align-items:flex-end;height:140px;margin-top:10px}
.bar{flex:1;text-align:center;font-size:12px;color:var(--mut);display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.bar i{display:block;background:var(--ac);border-radius:3px 3px 0 0;min-height:2px}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--bd);border-radius:6px}
table{border-collapse:collapse;width:100%;min-width:860px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--bd);vertical-align:top}
th{background:var(--soft);font-weight:600;font-size:13px;white-space:nowrap}
tr.g td{background:var(--soft);font:700 17px "Barlow Condensed",sans-serif}
.tag{display:inline-block;padding:1px 8px;border-radius:10px;background:var(--soft);font-size:12px;font-weight:600}
.tag.Diaria{background:var(--ac);color:var(--acx)}
button,select,input,textarea{font:inherit;color:var(--tx)}
.b{background:var(--ac);color:var(--acx);border:0;border-radius:5px;padding:8px 14px;font-weight:600;cursor:pointer}
.b.s{background:none;color:var(--tx);border:1px solid var(--bd)}
.b.x{background:none;color:var(--bad);border:1px solid var(--bd)}
.b.m{padding:3px 9px;font-size:13px}
input,select,textarea{background:var(--card);border:1px solid var(--bd);border-radius:5px;padding:7px 9px;width:100%}
.row input,.row select{width:auto}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--ac)}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 3px}
dialog{border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);width:min(560px,94vw);padding:20px}
dialog::backdrop{background:rgba(0,0,0,.5)}
.ex{display:grid;grid-template-columns:28px 1fr 90px 28px auto;gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--bd)}
.ex small{display:block;color:var(--mut)}
.ok{color:var(--ok)}.bad{color:var(--bad)}.wn{color:var(--wn)}
.empty{padding:26px;text-align:center;color:var(--mut)}
.tag.c-Crítica{background:var(--bad);color:var(--acx)}.tag.c-Alta{background:var(--wn);color:var(--acx)}.tag.c-Media{background:var(--soft)}.tag.c-Baja{background:none;border:1px solid var(--bd);color:var(--mut)}
.pl{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}.pl .card{margin:0}
.pc{border-left:5px solid var(--bd)}.pc.c-b-Crítica{border-left-color:var(--bad)}.pc.c-b-Alta{border-left-color:var(--wn)}.pc.c-b-Media{border-left-color:var(--ac)}
.pc ol{padding-left:20px;margin:10px 0 14px}.pc li{margin-bottom:4px}
.tag.c-ok{background:var(--ok);color:var(--acx)}
header select,header input{width:auto;max-width:190px}
.ex2{display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid var(--bd)}.ex2>div:first-child{flex:1;min-width:240px}.ex2 small{display:block;color:var(--mut)}
.act{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}.act input{width:180px}
.gate{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px));overflow:auto}.gate[hidden]{display:none}.gate .card{width:min(400px,100%);margin:0}.err{color:var(--bad);min-height:1.3em;margin-top:8px}
@media(max-width:560px){.ex{grid-template-columns:28px 1fr 28px}.ex>:nth-child(3){grid-column:2}.ex>:last-child{grid-column:2}}
@media print{header button,nav,.row,td:last-child,th:last-child{display:none}}
</style>
</head>
<body>
<header><h1>Programa de sanitización</h1><small>Gestión de limpieza y desinfección · Industria alimentaria</small><span id="who"></span><button class="b s" id="pw" style="color:inherit;border-color:currentColor">Contraseña</button><button class="b s" id="out" style="color:inherit;border-color:currentColor">Salir</button><button class="b s" style="color:inherit;border-color:currentColor" onclick="window.print()">Imprimir</button></header>
<nav id="nav"></nav>
<main id="v"></main><div id="gate" class="gate"></div>
<dialog id="dlg"><h2 id="dt" style="font-size:24px"></h2><div id="df"></div><div class="row" style="margin:18px 0 0;justify-content:flex-end"><button class="b s" id="dc">Cancelar</button><button class="b" id="ds">Guardar</button></div></dialog>
<script>
const FREQ=['Diaria','Semanal','Quincenal','Mensual','Trimestral','Anual'],DOW=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const AREAS=['Recepción','Producción','Empaque','Almacén','Cámaras frías','Sanitarios','Exteriores'];
const seed=[
['Producción','Superficies de contacto (mesas, bandas)','Diaria',1,'Detergente alcalino + sanitizante cuaternario','200 ppm QAC','Limpieza en seco, enjuague, detergente, enjuague, sanitizado','Sanitización','ATP < 150 RLU'],
['Producción','Utensilios y cuchillos','Diaria',1,'Detergente alcalino + sanitizante','200 ppm QAC','Lavado en 3 pasos y sanitizado por inmersión','Sanitización','Inspección visual'],
['Producción','Pisos y drenajes','Diaria',1,'Detergente clorado + desinfectante','200 ppm cloro','Retirar residuos, espuma, tallado, enjuague','Sanitización','Inspección visual'],
['Empaque','Selladoras y mesas de empaque','Diaria',1,'Sanitizante cuaternario','200 ppm QAC','Limpieza en seco y sanitizado','Operador de línea','ATP < 150 RLU'],
['Sanitarios','Sanitarios y lavamanos','Diaria',1,'Desinfectante clorado','200 ppm cloro','Limpieza, desinfección y reposición de insumos','Intendencia','Lista de verificación'],
['Producción','Paredes y puertas','Semanal',3,'Detergente alcalino','2 %','Espuma, contacto 10 min, tallado y enjuague','Sanitización','Inspección visual'],
['Almacén','Pisos, racks y tarimas','Semanal',5,'Detergente neutro','1 %','Barrido, trapeado y desinfección','Almacén','Inspección visual'],
['Producción','Equipo desarmable (molinos, mezcladoras)','Semanal',6,'Detergente alcalino + sanitizante','200 ppm QAC','Desarme completo, lavado COP y sanitizado','Sanitización','ATP + hisopado micro'],
['Cámaras frías','Evaporadores, pisos y paredes','Quincenal',2,'Sanitizante sin enjuague','200 ppm QAC','Retirar producto, limpiar y sanitizar','Sanitización','Inspección visual'],
['Producción','Techos, lámparas y tuberías','Mensual',0,'Detergente neutro','1 %','Limpieza en seco y paño húmedo con sanitizante','Mantenimiento','Inspección visual'],
['Exteriores','Contenedores de basura y andenes','Mensual',2,'Desinfectante clorado','500 ppm cloro','Lavado a presión y desinfección','Intendencia','Inspección visual'],
['Producción','Limpieza profunda de línea','Trimestral',0,'Detergente ácido / alcalino','Según ficha técnica','Desincrustación y paro programado','Sanitización','Micro + ATP'],
['Producción','Verificación y calibración de dosificadores','Anual',1,'No aplica','—','Calibración con proveedor de químicos','Calidad','Certificado']];
let S;try{S=JSON.parse(localStorage.getItem('mss2'))}catch(e){}
if(!S)S={tasks:seed.map((a,i)=>({id:'t'+i,area:a[0],item:a[1],freq:a[2],dow:a[3],chem:a[4],conc:a[5],method:a[6],resp:a[7],ver:a[8]})),recs:{},devs:[],n:100};
const CR=['Crítica','Alta','Media','Baja'];
if(!S.plans){S.plans=[
{id:'p1',name:'Limpieza y sanitizado de superficies de contacto',area:'Producción',crit:'Crítica',steps:'Retirar residuos sólidos en seco\nEnjuagar con agua potable\nAplicar detergente y tallar\nEnjuagar hasta eliminar el detergente\nAplicar sanitizante y respetar el tiempo de contacto\nVerificar (visual o ATP) antes de liberar la línea'},
{id:'p2',name:'Limpieza de pisos, paredes y drenajes',area:'Producción',crit:'Media',steps:'Retirar residuos y barrer en seco\nAplicar detergente con espuma o trapeador\nTallar y dejar actuar 10 minutos\nEnjuagar dirigiendo el agua al drenaje\nAplicar desinfectante'},
{id:'p3',name:'Desarme y limpieza de equipo (COP)',area:'Producción',crit:'Crítica',steps:'Bloquear la energía del equipo (LOTO)\nDesarmar las piezas según el manual\nLavar las piezas en tina, nunca en el piso\nEnjuagar y sanitizar\nArmar, sanitizar de nuevo y verificar con ATP'},
{id:'p4',name:'Sanitarios y áreas de servicio',area:'Sanitarios',crit:'Alta',steps:'Retirar la basura\nLimpiar lavamanos y sanitarios con detergente\nDesinfectar superficies de alto contacto\nReponer jabón, papel y gel antibacterial'}];
const m={t0:'p1',t1:'p1',t3:'p1',t2:'p2',t6:'p2',t4:'p4',t7:'p3'};S.tasks.forEach(t=>t.plan=m[t.id]||'')}
const P=id=>S.plans.find(p=>p.id===id),steps=p=>(p.steps||'').split('\n').map(s=>s.trim()).filter(Boolean);
const critTag=t=>{const p=P(t.plan);return p?` <span class="tag c-${p.crit}">${p.crit}</span>`:''};
const planBlock=(t,o)=>{const p=P(t.plan);return p?`<details ${o?'open':''} style="margin-top:6px"><summary style="cursor:pointer;color:var(--ac);font-weight:600">${e(p.name)}${critTag(t)}</summary><ol style="margin:6px 0 0;padding-left:20px">${steps(p).map(s=>`<li>${e(s)}</li>`).join('')}</ol></details>`:''};
const planTag=t=>{const p=P(t.plan);return p?`<small style="display:block;color:var(--mut)">${e(p.name)}${critTag(t)}</small>`:''};
S.plans.forEach(p=>{if(!p.freq){const t=S.tasks.find(t=>t.plan===p.id);p.freq=t?t.freq:'Diaria';p.dow=t?t.dow:1}});
const pf=[['name','Nombre del plan'],['area','Área',AREAS.map(a=>[a,a])],['crit','Criticidad de la limpieza',CR.map(a=>[a,a])],['freq','Frecuencia del plan',FREQ.map(a=>[a,a])],['dow','Día de la semana (aplica si no es diaria)',DOW.map((a,i)=>[i,a])],['steps','Instrucciones (una por línea)',0,6]];
Object.values(S.recs).forEach(r=>{if(r.vf===true){r.vf='ok';r.vby='—'}});
const inh=o=>{const p=P(o.plan);if(p){o.freq=p.freq;o.dow=p.dow}};
const fq=p=>(p.freq||'Diaria')+(p.freq&&p.freq!=='Diaria'?' ('+DOW[p.dow]+')':'');
const save=()=>sync();
const $=s=>document.querySelector(s),e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const parse=s=>{const[a,b,c]=s.split('-');return new Date(+a,b-1,+c)};
function due(t,d){const w=d.getDay(),n=d.getDate(),m=d.getMonth(),f=t.freq;if(f==='Diaria')return true;if(w!==+t.dow)return false;
if(f==='Semanal')return true;if(f==='Quincenal')return n<=7||(n>=15&&n<=21);if(f==='Mensual')return n<=7;if(f==='Trimestral')return n<=7&&m%3===0;return n<=7&&m===0}
const dueList=d=>S.tasks.filter(t=>due(t,d));
const done=(t,ds)=>S.recs[t.id+'|'+ds]?.done;
let tab='res',fF='',fA='',day=iso(new Date());
const ROLES={adm:['Administrador','res,mss,pln,reg,dev,usr,aud'],ops:['Operaciones (limpieza)','ops,pln'],cal:['Calidad (verificación)','cal,dev'],ins:['Inspector (liberación)','ins,res']};
const TN={res:'Resumen',mss:'Master Sanitation Schedule',pln:'Planes',reg:'Seguimiento',dev:'Desviaciones',ops:'Mis limpiezas',cal:'Por verificar',ins:'Por liberar',usr:'Usuarios',aud:'Trazabilidad'};
let role='adm',me='',auth=null,DB=null,UID='',ACC={},canE=false;try{const u=JSON.parse(localStorage.getItem('mss_u'));if(u&&ROLES[u.role]){role=u.role;me=u.me||''}}catch(e){}
const sv=()=>{try{localStorage.setItem('mss_u',JSON.stringify({role,me}))}catch(e){}};
if(!ROLES[role][1].split(',').includes(tab))tab=ROLES[role][1].split(',')[0];
function stats(d){const l=dueList(d),ds=iso(d);return[l.filter(t=>done(t,ds)).length,l.length]}
const pct=(a,b)=>b?Math.round(100*a/b):100;
function render(){
$('#nav').innerHTML=ROLES[role][1].split(',').map(k=>`<button class="${k===tab?'on':''}" data-t="${k}">${TN[k]}</button>`).join('');
$('#v').innerHTML={res:vRes,mss:vMss,pln:vPln,reg:vReg,dev:vDev,ops:vOps,cal:vCal,ins:vIns,usr:vUsr,aud:vAud}[tab]()}
function vRes(){
const td=new Date(),[a,b]=stats(td);let ta=0,tb=0,bars='';
for(let i=6;i>=0;i--){const d=new Date();d.setDate(td.getDate()-i);const[x,y]=stats(d),p=pct(x,y);if(i>0){ta+=x;tb+=y}
bars+=`<div class="bar">${p}%<i style="height:${p*.95}px;${p<90?'background:var(--wn)':''}"></i>${DOW[d.getDay()]} ${d.getDate()}</div>`}
const open=S.devs.filter(x=>x.st!=='Cerrada').length;
return `<div class="stats"><div class="st"><b>${a}/${b}</b><span>Tareas de hoy completadas</span></div>
<div class="st"><b>${pct(ta,tb)}%</b><span>Cumplimiento últimos 6 días</span></div>
<div class="st" style="border-color:${open?'var(--bad)':'var(--ok)'}"><b>${open}</b><span>Desviaciones abiertas</span></div>
<div class="st"><b>${S.tasks.length}</b><span>Tareas en el MSS</span></div></div>
<div class="card"><h3>Flujo de hoy: realizar → verificar → liberar</h3><div style="margin-top:8px">${pipe()}</div></div><div class="card"><h3>Cumplimiento diario, últimos 7 días</h3><div class="bars">${bars}</div></div>
<div class="card"><h3>Pendientes de hoy</h3>${dueList(td).filter(t=>!done(t,iso(td))).map(t=>`<div style="padding:6px 0;border-bottom:1px solid var(--bd)"><b>${e(t.item)}</b> <span class="tag">${e(t.area)}</span>${critTag(t)}</div>`).join('')||'<div class="empty">Todo al día. No hay tareas pendientes hoy.</div>'}</div>`}
function vMss(){
const L=S.tasks.filter(t=>(!fF||t.freq===fF)&&(!fA||t.area===fA));let h='';
for(const f of FREQ){const g=L.filter(t=>t.freq===f);if(!g.length)continue;h+=`<tr class="g"><td colspan="8">${f} (${g.length})</td></tr>`+g.map(t=>`<tr><td>${e(t.area)}</td><td><b>${e(t.item)}</b>${planTag(t)}</td><td>${f==='Diaria'?'Todos':DOW[t.dow]}</td><td>${e(t.chem)}<small style="display:block;color:var(--mut)">${e(t.conc)}</small></td><td>${e(t.method)}</td><td>${e(t.resp)}</td><td>${e(t.ver)}</td><td style="white-space:nowrap"><button class="b s m" data-ed="${t.id}">Editar</button> <button class="b x m" data-del="${t.id}">Quitar</button></td></tr>`).join('')}
return `<div class="row"><select data-ff><option value="">Todas las frecuencias</option>${FREQ.map(f=>`<option ${f===fF?'selected':''}>${f}</option>`).join('')}</select>
<select data-fa><option value="">Todas las áreas</option>${AREAS.map(f=>`<option ${f===fA?'selected':''}>${f}</option>`).join('')}</select><span class="grow"></span><button class="b" data-new>Agregar tarea</button></div>
<div class="tw"><table><thead><tr><th>Área</th><th>Tarea</th><th>Día</th><th>Químico y concentración</th><th>Método</th><th>Responsable</th><th>Verificación</th><th></th></tr></thead><tbody>${h||'<tr><td colspan="8" class="empty">Sin tareas con este filtro. Agrega una con “Agregar tarea”.</td></tr>'}</tbody></table></div>`}
function vDev(){
return `<div class="row"><span class="grow"></span><button class="b" data-dv="">Registrar desviación</button></div><div class="tw"><table><thead><tr><th>Fecha</th><th>Tarea / área</th><th>Hallazgo</th><th>Acción correctiva</th><th>Estado</th><th></th></tr></thead><tbody>${S.devs.map(x=>`<tr><td>${e(x.date)}</td><td>${e(x.task)}</td><td>${e(x.what)}</td><td>${e(x.fix)}</td><td class="${x.st==='Cerrada'?'ok':'bad'}"><b>${e(x.st)}</b></td><td style="white-space:nowrap"><button class="b s m" data-tg="${x.id}">${x.st==='Cerrada'?'Reabrir':'Cerrar'}</button> ${role==='adm'?`<button class="b x m" data-dd="${x.id}">Borrar</button>`:''}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">Sin desviaciones. Registra una cuando una limpieza falle la verificación.</td></tr>'}</tbody></table></div>`}
function vPln(){
const L=[...S.plans].sort((a,b)=>CR.indexOf(a.crit)-CR.indexOf(b.crit));
return `<div class="row"><span class="grow" style="color:var(--mut)">Crítica: contacto directo con el alimento · Alta: riesgo de contaminación cruzada · Media: ambiente de producción · Baja: áreas generales. Asigna cada plan a las tareas del MSS.</span>${role==='adm'?'<button class="b" data-np>Agregar plan</button>':''}</div><div class="pl">${L.map(p=>`<div class="card pc c-b-${p.crit}"><div class="row" style="margin:0 0 4px"><h3 class="grow" style="font-size:21px">${e(p.name)}</h3><span class="tag c-${p.crit}">${p.crit}</span></div><small style="color:var(--mut)">${e(p.area)} · <span class="tag ${p.freq||'Diaria'}">${fq(p)}</span> · ${S.tasks.filter(t=>t.plan===p.id).length} tarea(s) en el MSS</small><ol>${steps(p).map(s=>`<li>${e(s)}</li>`).join('')}</ol>${role==='adm'?`<button class="b s m" data-ep="${p.id}">Editar</button> <button class="b x m" data-dp="${p.id}">Borrar</button>`:''}</div>`).join('')||'<div class="empty" style="grid-column:1/-1">Aún no hay planes. Crea uno con “Agregar plan”.</div>'}</div>`}
const R=(t,ds)=>S.recs[t.id+'|'+ds]||{},stOf=r=>r.rel?'Liberada':r.vf==='ok'?'Verificada':r.done?'Realizada':r.flag?'Repetir':'Pendiente';
const SC={Pendiente:'Baja',Repetir:'Crítica',Realizada:'Media',Verificada:'Alta',Liberada:'ok'},chip=s=>`<span class="tag c-${SC[s]}">${s}</span>`;
const cr=t=>{const p=P(t.plan);return p?CR.indexOf(p.crit):4},LD=ds=>dueList(parse(ds)).sort((a,b)=>cr(a)-cr(b));
